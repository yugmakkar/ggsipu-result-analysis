# Copy this file to config.properties and fill in real values.
# config.properties is gitignored and must never be committed.

# --- Database ---
# Production (MySQL on Linux):
#   db.url=jdbc:mysql://localhost:3306/ipu_result?useSSL=false&serverTimezone=UTC
#   db.user=ipu_app
#   db.password=change-me
#
# Local run / tests (embedded H2 in MySQL-compatibility mode) is the default
# when no config.properties is present, so you usually only set these for MySQL.
db.url=jdbc:mysql://localhost:3306/ipu_result?useSSL=false&serverTimezone=UTC
db.user=ipu_app
db.password=change-me

# --- Web server ---
web.port=8080

# Directory where uploaded PDFs are stored (outside the webapp).
upload.dir=uploads

# Max upload size in bytes (default 20 MB).
upload.maxBytes=20971520
